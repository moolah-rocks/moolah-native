  - "gridxRowOdd"
  - "gridxRowTable"
  - "creditCardTransactionDate"
  - "creditCardPostingDate"
  - "creditCardPayee"
  - "creditcardTransAmtHK"
  - "creditcardTransHK"
  - "payee"
  - "amount"
  - "payeeItem0"
  - "pendingTxnLink"

merchant_selectors:
