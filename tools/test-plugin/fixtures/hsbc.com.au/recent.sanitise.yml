#
# HSBC Australia internet banking — credit card account view.
# Page structure: dojo `gridx` widget with role="row" / role="gridcell"
# inside `<div class="gridxRow">` wrappers. Amount sign convention:
# bare positive = charge (outflow), text-negative = payment/credit
# (inflow). Sign INVERTED from on-page to checkbook view by parser.

source: "~/Downloads/Moolah Sites/services.online-banking.hsbc.com.au.html"
seed: 99
synthetic_url: "https://services.online-banking.hsbc.com.au/gpib/group/gpib/cmn/layouts/default.html?uid=dashboard"

