name: Moolah
options:
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  defaultConfig: Debug
  bundleIdPrefix: rocks.moolah

# Debug-Tests is an iCloud-free variant of Debug used by every scheme's test
# action. Keeps local `ENABLE_ENTITLEMENTS=1` dev flows (run on Debug) isolated
# from `just test` — see plans/2026-04-20-strip-icloud-from-tests-design.md.
configs:
  Debug: debug
  Debug-Tests: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_TESTABILITY: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES

    # ---- CloudKit container ----
    # CLOUDKIT_CONTAINER_ID is set per-configuration on each app target
    # below (Debug/Debug-Tests → iCloud.rocks.moolah.app.test, Release →
    # iCloud.rocks.moolah.app.v2). Surfaced to Swift via the
    # MoolahCloudKitContainer Info.plist key and read by
    # CloudKitContainer.app. Must stay in sync with
    # fastlane/Moolah.entitlements (Release-only, app.v2),
    # fastlane/Moolah-mac.entitlements (Release-only, app.v2),
    # scripts/inject-entitlements.sh (Debug-only, lists only app.test),
    # and scripts/cloudkit-config.sh (CLOUDKIT_CONTAINER_ID_RELEASE /
    # CLOUDKIT_CONTAINER_ID_TEST). Refs issue #495.

    # ---- Versioning ----
    # CURRENT_PROJECT_VERSION is a placeholder. Fastlane (`fastlane beta` /
    # `fastlane release`) auto-increments via `increment_build_number`
    # against `latest_testflight_build_number` before archiving. Local
    # Debug builds keep "1" — fine, since local builds are never uploaded.
    # `scripts/check-release-build-number.sh` is wired as a pre-build phase
    # on both app targets and fails any Release build that still sees "1",
    # so a manual `xcodebuild archive` cannot collide with a real
    # TestFlight build number.
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"

    # ---- Signing ----
    # DEVELOPMENT_TEAM is env-driven so a developer can set their own team
    # for local Debug builds without editing project.yml. The distribution
    # signing settings (CODE_SIGN_STYLE, CODE_SIGN_IDENTITY,
    # CODE_SIGN_ENTITLEMENTS) live on the Release config of each app
    # target — they must be scoped to the app target so SPM dependencies
    # (e.g. GRDB) don't try to apply provisioning profiles, which they
    # don't support. The dynamic PROVISIONING_PROFILE_SPECIFIER comes
    # from `match` at fastlane build-time via target-scoped xcargs.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}

    # Keep Xcode predictable
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES

fileGroups:
  - plans
  - CLAUDE.md
  - guides
  - justfile
  - project.yml

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    # Pinned to an exact version. Moolah.xcodeproj is gitignored, so
    # Package.resolved isn't tracked; pinning here is the substitute.
    # Bump deliberately when we want to take a new release.
    exactVersion: 7.10.0
  ImportExtensionKit:
    path: Modules/ImportExtensionKit

targets:
  Moolah_iOS:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info-macOS.plist
      - path: Domain
      - path: Backends
      - path: Features
      - path: Shared
      - path: Automation
      - path: UITestSupport
    preBuildScripts:
      - script: "${SRCROOT}/scripts/check-release-build-number.sh"
        name: Verify Release build number
        basedOnDependencyAnalysis: false
    dependencies:
      - sdk: AppIntents.framework
      - sdk: FoundationModels.framework
      - package: GRDB
      - package: ImportExtensionKit
      - target: MoolahImportExtension_iOS
        embed: true
        codeSignOnCopy: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: rocks.moolah.app
        PRODUCT_NAME: Moolah
        PRODUCT_MODULE_NAME: Moolah
        INFOPLIST_FILE: App/Info-iOS.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CLOUDKIT_ENVIRONMENT: Development
          CLOUDKIT_CONTAINER_ID: iCloud.rocks.moolah.app.test
        Debug-Tests:
          # Tests must never pick up iCloud entitlements, even when a dev
          # runs `ENABLE_ENTITLEMENTS=1 just generate` to inject them into Debug.
          CODE_SIGN_ENTITLEMENTS: ""
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
          # Values are unused at runtime (test host has no iCloud entitlement
          # and uses in-memory stores) but must be defined so Info.plist
          # expansion yields literal strings rather than e.g.
          # "$(CLOUDKIT_ENVIRONMENT)".
          CLOUDKIT_ENVIRONMENT: Development
          CLOUDKIT_CONTAINER_ID: iCloud.rocks.moolah.app.test
        Release:
          # Distribution signing scoped to this target only — never inherit
          # to SPM dependencies which can't be signed with provisioning
          # profiles. PROVISIONING_PROFILE_SPECIFIER is xcodegen-substituted
          # from $IOS_PROVISIONING_PROFILE; fastlane sets that env var from
          # `match`'s output and re-runs `just generate` before `build_app`.
          # Local Debug builds ignore this Release block, so an unset env
          # var (xcodegen writing the literal `${IOS_PROVISIONING_PROFILE}`)
          # is harmless.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          CODE_SIGN_ENTITLEMENTS: fastlane/Moolah.entitlements
          PROVISIONING_PROFILE_SPECIFIER: ${IOS_PROVISIONING_PROFILE}
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CLOUDKIT_ENABLED"
          CLOUDKIT_ENVIRONMENT: Production
          CLOUDKIT_CONTAINER_ID: iCloud.rocks.moolah.app.v2

  Moolah_macOS:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info-iOS.plist
      - path: Domain
      - path: Backends
      - path: Features
      - path: Shared
      - path: Automation
      - path: UITestSupport
    preBuildScripts:
      - script: "${SRCROOT}/scripts/check-release-build-number.sh"
        name: Verify Release build number
        basedOnDependencyAnalysis: false
    dependencies:
      - sdk: AppIntents.framework
      - sdk: FoundationModels.framework
      - package: GRDB
      - package: ImportExtensionKit
      - target: MoolahImportExtension_macOS
        embed: true
        codeSignOnCopy: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: rocks.moolah.app
        PRODUCT_NAME: Moolah
        PRODUCT_MODULE_NAME: Moolah
        INFOPLIST_FILE: App/Info-macOS.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CLOUDKIT_ENVIRONMENT: Development
          CLOUDKIT_CONTAINER_ID: iCloud.rocks.moolah.app.test
        Debug-Tests:
          CODE_SIGN_ENTITLEMENTS: ""
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
          CLOUDKIT_ENVIRONMENT: Development
          CLOUDKIT_CONTAINER_ID: iCloud.rocks.moolah.app.test
        Release:
          # See Moolah_iOS.Release for why signing is scoped to the app
          # target and not inherited from settings.base.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          CODE_SIGN_ENTITLEMENTS: fastlane/Moolah-mac.entitlements
          PROVISIONING_PROFILE_SPECIFIER: ${MAC_PROVISIONING_PROFILE}
          ENABLE_HARDENED_RUNTIME: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CLOUDKIT_ENABLED"
          CLOUDKIT_ENVIRONMENT: Production
          CLOUDKIT_CONTAINER_ID: iCloud.rocks.moolah.app.v2

  MoolahImportExtension_iOS:
    type: app-extension
    platform: iOS
    sources:
      - path: MoolahImportExtension_iOS
      # Shared SwiftUI confirmation view consumed by both extension
      # targets; lives outside the platform-specific source roots so it
      # has to be pulled in explicitly.
      - path: MoolahImportExtension_Shared/ImportConfirmationView.swift
      # Platform-agnostic controller + ExtensionPrincipalContext protocol
      # — same rationale.
      - path: MoolahImportExtension_Shared/PrincipalController.swift
      # The generated JS bundle is the single
      # NSExtensionJavaScriptPreprocessingFile Safari loads — pull it into
      # the .appex resources phase. xcodegen treats non-source files
      # under `sources:` as resources automatically.
      - path: MoolahImportExtension_Shared/Generated/extension-entry.bundle.js
        type: file
    dependencies:
      - package: ImportExtensionKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: rocks.moolah.app.importextension
        PRODUCT_NAME: ImportExtension
        PRODUCT_MODULE_NAME: ImportExtension
        INFOPLIST_FILE: MoolahImportExtension_iOS/Generated/Info.plist
        # SKIP_INSTALL must be YES on an embedded app-extension target so
        # the extension is only copied into the parent app's archive
        # (`Plugins/`) and is not also installed as a top-level archive
        # product. A NO value emits a second extension product into the
        # archive that App Store Connect rejects on upload.
        SKIP_INSTALL: YES
      configs:
        Release:
          # Plain `just generate` leaves Debug entitlement-free so local
          # builds don't need a Mac App Development provisioning profile
          # (mirrors the main app target's pattern, see
          # Moolah_macOS.configs.Release). `ENABLE_ENTITLEMENTS=1 just
          # generate` opts in: scripts/inject-entitlements.sh injects a
          # Debug: block that points at this same entitlements file, so
          # the .appex is signed with the App Group and macOS pluginkit
          # registers it. Without that flag, the Debug build still
          # produces an .appex but it has no App Group and the share
          # sheet entry never appears.
          CODE_SIGN_ENTITLEMENTS: MoolahImportExtension_iOS/Entitlements.entitlements
          # Manual distribution signing, scoped to this target — mirrors
          # Moolah_iOS.configs.Release. The embedded .appex has its own
          # bundle id (rocks.moolah.app.importextension), which the parent
          # app's App Store profile does not cover, so it needs a separate
          # profile specifier. PROVISIONING_PROFILE_SPECIFIER is
          # xcodegen-substituted from $IOS_EXT_PROVISIONING_PROFILE, which
          # the iOS fastlane lanes set from `match`'s output before
          # re-running `just generate`. An unset env var is harmless: local
          # Debug builds ignore this Release block.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: ${IOS_EXT_PROVISIONING_PROFILE}

  MoolahImportExtension_macOS:
    type: app-extension
    platform: macOS
    sources:
      - path: MoolahImportExtension_macOS
      # Shared SwiftUI confirmation view — see MoolahImportExtension_iOS.
      - path: MoolahImportExtension_Shared/ImportConfirmationView.swift
      # Platform-agnostic controller — see MoolahImportExtension_iOS.
      - path: MoolahImportExtension_Shared/PrincipalController.swift
      # See MoolahImportExtension_iOS for the rationale on bundling the
      # generated JS as a target resource.
      - path: MoolahImportExtension_Shared/Generated/extension-entry.bundle.js
        type: file
    dependencies:
      - package: ImportExtensionKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: rocks.moolah.app.importextension
        PRODUCT_NAME: ImportExtension
        PRODUCT_MODULE_NAME: ImportExtension
        INFOPLIST_FILE: MoolahImportExtension_macOS/Generated/Info.plist
        # See MoolahImportExtension_iOS.settings.base for SKIP_INSTALL rationale.
        SKIP_INSTALL: YES
      configs:
        Release:
          # Release-only entitlements — see MoolahImportExtension_iOS for
          # the rationale.
          CODE_SIGN_ENTITLEMENTS: MoolahImportExtension_macOS/Entitlements.entitlements
          # The hardened runtime is required on every macOS executable
          # the App Store accepts — extensions included. Mirrors the
          # `Moolah_macOS.Release` setting above; without it the embedded
          # extension binary fails App Store validation.
          ENABLE_HARDENED_RUNTIME: YES
          # Manual Developer ID signing, scoped to this target — mirrors
          # Moolah_macOS.configs.Release. The embedded .appex needs its own
          # Developer ID profile (its bundle id differs from the parent
          # app's). PROVISIONING_PROFILE_SPECIFIER is xcodegen-substituted
          # from $MAC_EXT_PROVISIONING_PROFILE, which the mac `zip` lane
          # sets from `match`'s output before re-running `just generate`.
          # An unset env var is harmless: local Debug builds ignore this
          # Release block.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          PROVISIONING_PROFILE_SPECIFIER: ${MAC_EXT_PROVISIONING_PROFILE}

  MoolahTests_iOS:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MoolahTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: rocks.moolah.tests
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Moolah.app/Moolah"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Moolah_iOS
      - package: GRDB
      - package: ImportExtensionKit

  MoolahTests_macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MoolahTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: rocks.moolah.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        ENABLE_HARDENED_RUNTIME: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Moolah.app/Contents/MacOS/Moolah"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Moolah_macOS
      - package: GRDB
      - package: ImportExtensionKit

  MoolahBenchmarks_macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MoolahBenchmarks
      - path: MoolahTests/Support
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: rocks.moolah.benchmarks
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        ENABLE_HARDENED_RUNTIME: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Moolah.app/Contents/MacOS/Moolah"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Moolah_macOS
      - package: GRDB

  MoolahUITests_macOS:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: MoolahUITests_macOS
      - path: UITestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: rocks.moolah.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        ENABLE_HARDENED_RUNTIME: NO
        TEST_TARGET_NAME: Moolah_macOS
    dependencies:
      - target: Moolah_macOS
      # Drivers compute on-disk paths via InboxWriter.inboxFileURL(for:in:)
      # so the "Inbox" path component isn't duplicated as a literal.
      - package: ImportExtensionKit

schemes:
  Moolah:
    build:
      targets:
        Moolah_iOS: all
        Moolah_macOS: all
    run:
      executable: Moolah_macOS

  Moolah-iOS:
    build:
      targets:
        Moolah_iOS: all
    test:
      config: Debug-Tests
      targets:
        - MoolahTests_iOS

  Moolah-macOS:
    build:
      targets:
        Moolah_macOS: all
    test:
      config: Debug-Tests
      targets:
        - MoolahTests_macOS

  Moolah-Benchmarks:
    build:
      targets:
        Moolah_macOS: all
        MoolahBenchmarks_macOS: [test]
    test:
      config: Debug-Tests
      targets:
        - MoolahBenchmarks_macOS

  Moolah-macOS-UITests:
    build:
      targets:
        Moolah_macOS: all
        MoolahUITests_macOS: [test]
    test:
      config: Debug-Tests
      targets:
        - MoolahUITests_macOS
